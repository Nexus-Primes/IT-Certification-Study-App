  <script>
    /* Paint the saved theme before anything else renders, so a light-theme user never sees a dark
       flash while progress is still loading. app.js re-applies the real settings once it has them. */
    (function () {
      try {
        var raw = localStorage.getItem('cert-study-appearance'); if (!raw) return;
        var a = JSON.parse(raw), root = document.documentElement;
        var mode = a.mode === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : (a.mode === 'light' ? 'light' : 'dark');
        root.dataset.theme = mode;
        if (a.preset && a.preset !== 'default') root.dataset.preset = a.preset;
        var v = a.vars && a.vars[mode];
        if (v) {
          root.style.setProperty('--primary', v.primary); root.style.setProperty('--primary-soft', v.soft); root.style.setProperty('--primary-strong', v.strong);
          if (v.onPrimary) root.style.setProperty('--on-primary', v.onPrimary);
        }
      } catch (e) {}
    })();
  </script>
