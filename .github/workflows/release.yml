name: Release

# Push a tag like v240 (the same number as APP_VERSION) to build the Windows installer and attach
# it to a DRAFT release. Nothing reaches users until you publish that draft by hand on GitHub:
# draft releases are invisible to the in-app updater.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-tests:
    name: Full test suite
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: pip install pymupdf
      - name: Version numbers agree
        run: node scripts/sync-version.js --check
      - name: Desktop tests (Node)
        run: npm run test:desktop
      - name: Full browser suite (Python, drives headless Edge)
        run: python tests/run.py

  build:
    name: Build installer and draft release
    needs: full-tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Tag must match APP_VERSION
        shell: bash
        run: |
          app=$(grep -o "const APP_VERSION = 'v[0-9]*'" app/app.js | grep -o "v[0-9]*")
          if [ "$app" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match APP_VERSION ${app}"; exit 1; fi
          node scripts/sync-version.js --check
      - name: Build the installer
        run: npx electron-builder --win --publish never
      - name: Write release notes
        run: node scripts/release-notes.js > release-notes.md
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "Cert Study ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            release/Cert-Study-Setup-*.exe release/Cert-Study-Setup-*.exe.blockmap release/latest.yml
